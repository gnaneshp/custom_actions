name: cache dependency
description: cache dependency composite action
inputs:
  cache_required:
    default: true
    required: false
    description: cache required?
outputs:
  cache_used:
    description: cache used?
    value: ${{ steps.cache_use.outputs.cache_used }}
runs:
  using: composite
  
  steps:
    - name: Cache dependencies
      id: cache
      if: inputs.cache_required=='true'
      uses: actions/cache@v3
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      
    - name: Install dependencies
      id: cache_use
      if: steps.cache.outputs.cache-hit != 'true' || inputs.cache_required != 'true'
      run: |
        npm ci
        echo "cache_used=false">>"$GITHUB_OUTPUT"
      shell: bash
    
